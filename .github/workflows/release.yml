name: Release

# Push a tag like v0.2.0 to build the app and publish a GitHub release.
# The tag must match CFBundleShortVersionString in Resources/Info.plist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check that the tag matches the app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          echo "App version: $VERSION, tag: $GITHUB_REF_NAME"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$VERSION in Resources/Info.plist"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/fstn-view-$VERSION.zip"
          DMG="build/fstn-view-$VERSION.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" "$ZIP" \
              --title "fstn view $VERSION" \
              --generate-notes
          fi
